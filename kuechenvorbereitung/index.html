<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171513">
  <title>Küchenvorbereitung – Clauß Flammkuchen</title>
  <style>
    :root {
      --ink: #171513;
      --muted: #6f6964;
      --paper: #f6f1eb;
      --card: #fffdf9;
      --rose: #c97d82;
      --rose-dark: #8f4c53;
      --rose-soft: #eed9da;
      --green: #39745a;
      --green-soft: #dceadf;
      --amber: #9d6822;
      --amber-soft: #f1e3c9;
      --line: #ddd4cb;
      --shadow: 0 14px 38px rgba(48, 39, 32, .10);
      --meat: #9b5d58;
      --meat-soft: #f4e4e1;
      --cheese: #9a7120;
      --cheese-soft: #f5ecd3;
      --vegetable: #4f7657;
      --vegetable-soft: #e1eee2;
      --sweet: #8a5f86;
      --sweet-soft: #efe3ef;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 0%, rgba(201, 125, 130, .17), transparent 28rem),
        var(--paper);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, input { font: inherit; }
    button { color: inherit; }

    .app {
      width: min(100% - 28px, 980px);
      margin: 0 auto;
      padding: 28px 0 72px;
    }

    .topline {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 24px;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: var(--rose-dark);
      font-size: .75rem;
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2rem, 7vw, 3.6rem);
      font-weight: 500;
      line-height: .98;
      letter-spacing: -.035em;
    }

    .reset-button, .text-button {
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .reset-button {
      flex: none;
      padding: 8px 0;
      font-size: .88rem;
    }

    .panel {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: rgba(255, 253, 249, .78);
      box-shadow: 0 8px 30px rgba(48, 39, 32, .05);
      backdrop-filter: blur(10px);
    }

    .level-panel { margin-bottom: 18px; }

    .panel-label {
      display: block;
      margin: 0 0 12px;
      font-size: .82rem;
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .levels {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .level-button {
      min-height: 58px;
      padding: 10px 8px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: var(--card);
      cursor: pointer;
      transition: .18s ease;
    }

    .level-button strong, .level-button small { display: block; }
    .level-button strong { font-size: .98rem; }
    .level-button small { margin-top: 2px; color: var(--muted); font-size: .72rem; }
    .level-button.active {
      border-color: var(--ink);
      background: var(--ink);
      color: white;
      transform: translateY(-1px);
    }
    .level-button.active small { color: rgba(255,255,255,.68); }

    .progress-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 22px 2px 14px;
      color: var(--muted);
      font-size: .9rem;
    }

    .filter-wrap { margin: 0 0 14px; }

    .filter-label {
      display: block;
      margin: 0 0 8px 2px;
      color: var(--muted);
      font-size: .76rem;
      font-weight: 800;
      letter-spacing: .05em;
      text-transform: uppercase;
    }

    .filter-bar {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding: 2px 2px 6px;
      scrollbar-width: thin;
    }

    .filter-button {
      flex: none;
      min-height: 38px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 253, 249, .76);
      color: var(--muted);
      cursor: pointer;
      font-size: .78rem;
      font-weight: 760;
      white-space: nowrap;
    }

    .filter-button.active {
      border-color: var(--ink);
      background: var(--ink);
      color: white;
    }

    .progress-track {
      flex: 1;
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: #e5ddd4;
    }

    .progress-bar {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: var(--rose);
      transition: width .25s ease;
    }

    .ingredient-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-auto-flow: dense;
      gap: 10px;
      align-items: stretch;
    }

    .ingredient-card {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 128px;
      padding: 14px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--card);
      box-shadow: 0 6px 22px rgba(48, 39, 32, .06);
      cursor: pointer;
      text-align: left;
      transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
    }

    .ingredient-card:hover {
      transform: translateY(-3px);
      border-color: #bdb1a7;
      box-shadow: var(--shadow);
    }

    .ingredient-card:focus-visible, button:focus-visible, input:focus-visible {
      outline: 3px solid rgba(201, 125, 130, .55);
      outline-offset: 3px;
    }

    .ingredient-card::after {
      content: "";
      position: absolute;
      right: -36px;
      bottom: -47px;
      width: 120px;
      height: 90px;
      border: 1px solid rgba(201, 125, 130, .27);
      border-radius: 50%;
      transform: rotate(-22deg);
    }

    .size-long-large { grid-column: span 4; min-height: 136px; }
    .size-long-small { grid-column: span 3; min-height: 128px; }
    .size-large { grid-column: span 3; min-height: 136px; }
    .size-medium { grid-column: span 2; min-height: 138px; }
    .size-small { grid-column: span 2; min-height: 122px; }
    .size-none { grid-column: span 2; min-height: 122px; border-style: dashed; }

    .ingredient-card.category-meat { background: var(--meat-soft); border-color: #dfc5c1; }
    .ingredient-card.category-cheese { background: var(--cheese-soft); border-color: #e2d2a7; }
    .ingredient-card.category-vegetable { background: var(--vegetable-soft); border-color: #c4d9c6; }
    .ingredient-card.category-sweet { background: var(--sweet-soft); border-color: #d9c3d7; }

    .ingredient-card.category-meat .box-tag { background: rgba(155, 93, 88, .14); color: #77423e; }
    .ingredient-card.category-cheese .box-tag { background: rgba(154, 113, 32, .14); color: #76530f; }
    .ingredient-card.category-vegetable .box-tag { background: rgba(79, 118, 87, .14); color: #355c3d; }
    .ingredient-card.category-sweet .box-tag { background: rgba(138, 95, 134, .14); color: #694665; }

    .box-tag {
      align-self: flex-start;
      padding: 5px 9px;
      border-radius: 999px;
      background: var(--rose-soft);
      color: var(--rose-dark);
      font-size: .72rem;
      font-weight: 750;
    }

    .ingredient-name {
      position: relative;
      z-index: 1;
      margin: 20px 0 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.18rem, 2.4vw, 1.62rem);
      font-weight: 500;
      line-height: 1.05;
    }

    .card-action {
      position: relative;
      z-index: 1;
      margin-top: 14px;
      color: var(--muted);
      font-size: .82rem;
    }

    .empty-state {
      grid-column: 1 / -1;
      padding: 36px 18px;
      border: 1px dashed var(--line);
      border-radius: 20px;
      color: var(--muted);
      text-align: center;
    }

    .summary {
      display: none;
      margin-top: 18px;
      padding: clamp(20px, 5vw, 34px);
      border-radius: 24px;
      background: var(--ink);
      color: white;
      box-shadow: var(--shadow);
    }

    .summary.visible { display: block; animation: rise .3s ease both; }
    .summary h2 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.8rem, 5vw, 2.7rem);
      font-weight: 500;
    }
    .summary-intro { margin: 7px 0 22px; color: rgba(255,255,255,.66); }
    .summary-filter-wrap { margin: 0 0 14px; }
    .summary .filter-label { color: rgba(255,255,255,.58); }
    .summary .filter-button {
      border-color: rgba(255,255,255,.2);
      background: rgba(255,255,255,.08);
      color: rgba(255,255,255,.76);
    }
    .summary .filter-button.active { border-color: white; background: white; color: var(--ink); }
    .prep-list, .checked-list { display: grid; gap: 9px; margin: 0; padding: 0; list-style: none; }
    .prep-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      border-radius: 15px;
      background: rgba(255,255,255,.09);
    }
    .prep-item.category-meat { box-shadow: inset 4px 0 0 var(--meat); }
    .prep-item.category-cheese { box-shadow: inset 4px 0 0 #c69a3c; }
    .prep-item.category-vegetable { box-shadow: inset 4px 0 0 #6a9a74; }
    .prep-item.category-sweet { box-shadow: inset 4px 0 0 #a679a2; }
    .prep-item.category-toppings { box-shadow: inset 4px 0 0 #d39a59; }
    .prep-item.done { opacity: .55; }
    .prep-check {
      display: flex;
      flex: 1;
      align-items: center;
      gap: 13px;
      cursor: pointer;
    }
    .prep-check input {
      width: 24px;
      height: 24px;
      flex: none;
      margin: 0;
      accent-color: var(--rose);
      cursor: pointer;
    }
    .prep-item.done .prep-text { text-decoration: line-through; }
    .prep-number {
      display: grid;
      flex: none;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 50%;
      background: var(--rose);
      font-weight: 850;
    }
    .all-good {
      padding: 17px;
      border-radius: 15px;
      background: rgba(84, 153, 113, .22);
      color: #d9f4e2;
    }
    .checked-wrap { margin-top: 24px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,.16); }
    .checked-title { margin: 0 0 10px; color: rgba(255,255,255,.64); font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; }
    .toppings-wrap { margin-top: 24px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,.16); }
    .checked-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,.1);
    }
    .checked-item:last-child { border-bottom: 0; }
    .checked-meta { color: rgba(255,255,255,.6); font-size: .82rem; }
    .edit-button {
      border: 0;
      background: transparent;
      color: #efb7bb;
      cursor: pointer;
      font-size: .84rem;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .modal-backdrop {
      position: fixed;
      z-index: 20;
      inset: 0;
      display: none;
      align-items: end;
      justify-content: center;
      padding: 16px;
      background: rgba(23, 21, 19, .58);
      backdrop-filter: blur(5px);
    }
    .modal-backdrop.open { display: flex; }

    .modal {
      width: min(100%, 580px);
      max-height: min(90vh, 760px);
      overflow: auto;
      padding: 23px;
      border-radius: 25px 25px 18px 18px;
      background: var(--card);
      box-shadow: 0 28px 90px rgba(0,0,0,.3);
      animation: rise .22s ease both;
    }

    @keyframes rise { from { opacity: 0; transform: translateY(15px); } }

    .modal-head {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 15px;
    }
    .modal h2 {
      margin: 4px 0 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 2.15rem;
      font-weight: 500;
      line-height: 1;
    }
    .modal-box-label { margin: 8px 0 0; color: var(--muted); font-size: .86rem; }
    .close-button {
      display: grid;
      flex: none;
      width: 40px;
      height: 40px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      font-size: 1.2rem;
    }

    .rule-note {
      margin: 20px 0;
      padding: 13px 15px;
      border-radius: 14px;
      background: #f0ebe5;
      color: #504b47;
      font-size: .9rem;
      line-height: 1.45;
    }

    .field-label {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 13px;
      font-weight: 760;
    }
    .field-label output { color: var(--rose-dark); font-size: 1.25rem; }
    .slider { width: 100%; accent-color: var(--rose-dark); cursor: pointer; }
    .slider-scale {
      display: flex;
      justify-content: space-between;
      margin-top: 5px;
      color: var(--muted);
      font-size: .72rem;
    }

    .reserve-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 25px;
      padding-top: 19px;
      border-top: 1px solid var(--line);
    }
    .reserve-row strong, .reserve-row small { display: block; }
    .reserve-row small { margin-top: 3px; color: var(--muted); }
    .stepper { display: flex; align-items: center; gap: 10px; }
    .step-button {
      display: grid;
      width: 39px;
      height: 39px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: white;
      cursor: pointer;
      font-size: 1.25rem;
    }
    .step-value { min-width: 24px; text-align: center; font-size: 1.1rem; font-weight: 800; }

    .binary-choice { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .stock-check {
      margin-top: 22px;
      padding-top: 19px;
      border-top: 1px solid var(--line);
    }
    .stock-check .field-label { margin-bottom: 10px; }
    .choice-button {
      min-height: 62px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: white;
      cursor: pointer;
      font-weight: 750;
    }
    .choice-button.selected {
      border-color: var(--ink);
      background: var(--ink);
      color: white;
    }

    .live-result {
      margin: 22px 0 14px;
      padding: 14px 15px;
      border-radius: 14px;
      background: var(--green-soft);
      color: #21543d;
      line-height: 1.35;
    }
    .live-result.needs-prep { background: var(--amber-soft); color: #75480d; }
    .live-result strong { display: block; margin-bottom: 2px; }

    .confirm-button {
      width: 100%;
      min-height: 56px;
      border: 0;
      border-radius: 15px;
      background: var(--rose-dark);
      color: white;
      cursor: pointer;
      font-weight: 820;
      box-shadow: 0 7px 18px rgba(143, 76, 83, .2);
    }

    @media (min-width: 700px) {
      .modal-backdrop { align-items: center; }
      .modal { border-radius: 25px; }
    }

    @media (max-width: 620px) {
      .app { width: min(100% - 20px, 980px); padding-top: 20px; }
      .topline { align-items: center; }
      .reset-button { max-width: 84px; }
      .panel { padding: 13px; border-radius: 18px; }
      .level-button { min-height: 61px; }
      .level-button small { font-size: .66rem; }
      .ingredient-grid { grid-template-columns: repeat(2, 1fr); gap: 9px; }
      .size-long-large, .size-long-small, .size-large { grid-column: span 2; min-height: 128px; }
      .size-medium, .size-small, .size-none { grid-column: span 1; min-height: 145px; }
      .ingredient-card { padding: 14px; border-radius: 17px; }
      .ingredient-name { font-size: 1.22rem; }
      .box-tag { font-size: .66rem; }
      .modal { padding: 19px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="topline">
      <div>
        <p class="eyebrow">Clauß · Flammkuchen</p>
        <h1>Küchen&shy;vorbereitung</h1>
      </div>
      <button class="reset-button" id="resetButton" type="button">Neu beginnen</button>
    </div>

    <section class="panel level-panel" aria-labelledby="levelLabel">
      <span class="panel-label" id="levelLabel">Wie wird der Abend?</span>
      <div class="levels" role="group" aria-label="Erwartete Gästezahl">
        <button class="level-button" type="button" data-level="wenig">
          <strong>Wenig</strong><small>ruhiger Abend</small>
        </button>
        <button class="level-button" type="button" data-level="normal">
          <strong>Normal</strong><small>normaler Betrieb</small>
        </button>
        <button class="level-button" type="button" data-level="hustle">
          <strong>Hustle</strong><small>volles Haus</small>
        </button>
      </div>
    </section>

    <div class="progress-row" aria-live="polite">
      <div class="progress-track" aria-hidden="true"><div class="progress-bar" id="progressBar"></div></div>
      <span id="progressText">0 von 36 geprüft</span>
    </div>

    <div class="filter-wrap">
      <span class="filter-label">Zutaten filtern</span>
      <div class="filter-bar" id="checkFilters" role="group" aria-label="Noch zu prüfende Zutaten filtern"></div>
    </div>

    <section class="ingredient-grid" id="ingredientGrid" aria-label="Noch zu prüfende Zutaten"></section>

    <section class="summary" id="summary" aria-live="polite">
      <h2>Alles geprüft.</h2>
      <p class="summary-intro" id="summaryIntro"></p>
      <div class="filter-wrap summary-filter-wrap" id="todoFilterWrap">
        <span class="filter-label">To-dos filtern</span>
        <div class="filter-bar" id="todoFilters" role="group" aria-label="Vorbereitungsaufgaben filtern"></div>
      </div>
      <ul class="prep-list" id="prepList"></ul>
      <div class="toppings-wrap">
        <p class="checked-title">Toppings</p>
        <ul class="prep-list" id="toppingsList"></ul>
      </div>
      <div class="checked-wrap">
        <p class="checked-title">Geprüfte Bestände</p>
        <ul class="checked-list" id="checkedList"></ul>
      </div>
    </section>
  </main>

  <div class="modal-backdrop" id="modalBackdrop" role="presentation">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <div>
          <h2 id="modalTitle"></h2>
          <p class="modal-box-label" id="modalBoxLabel"></p>
        </div>
        <button class="close-button" id="closeModal" type="button" aria-label="Schließen">×</button>
      </div>

      <p class="rule-note" id="ruleNote"></p>

      <div id="sliderArea">
        <label class="field-label" for="fillSlider">
          <span id="fillLabel">Aktuelle Box gefüllt</span>
          <output id="fillOutput">100 %</output>
        </label>
        <input class="slider" id="fillSlider" type="range" min="0" max="100" step="5" value="100">
        <div class="slider-scale" id="sliderScale" aria-hidden="true"><span>leer</span><span>halbvoll</span><span>voll</span></div>

        <div class="reserve-row" id="reserveRow">
          <div><strong>Weitere Box vorhanden?</strong><small>Bereits vorbereiteter Vorrat</small></div>
          <div class="stepper" aria-label="Anzahl weiterer Boxen">
            <button class="step-button" id="reserveMinus" type="button" aria-label="Eine Box weniger">−</button>
            <span class="step-value" id="reserveValue">0</span>
            <button class="step-button" id="reservePlus" type="button" aria-label="Eine weitere Box">+</button>
          </div>
        </div>

        <div class="stock-check" id="stockCheck" hidden>
          <p class="field-label" id="stockCheckLabel"></p>
          <div class="binary-choice">
            <button class="choice-button" type="button" data-stock-ready="true">Ja, liegt bereit</button>
            <button class="choice-button" type="button" data-stock-ready="false">Nein</button>
          </div>
        </div>
      </div>

      <div id="binaryArea" hidden>
        <p class="field-label">Liegt eine Packung bereit?</p>
        <div class="binary-choice">
          <button class="choice-button" id="readyYes" type="button" data-ready="true">Ja, bereit</button>
          <button class="choice-button" id="readyNo" type="button" data-ready="false">Nein</button>
        </div>
      </div>

      <div class="live-result" id="liveResult"></div>
      <button class="confirm-button" id="confirmButton" type="button">Prüfung bestätigen</button>
    </section>
  </div>

  <script>
    const INGREDIENTS = [
      {
        id: "speck",
        name: "Speck",
        box: "Box lang groß",
        size: "long-large",
        unit: "lange große Box Speck",
        rules: {
          wenig: "Nur vorbereiten, wenn die aktuelle Box ganz leer und keine Vorratsbox vorhanden ist.",
          normal: "Nur vorbereiten, wenn die aktuelle Box ganz leer und keine Vorratsbox vorhanden ist.",
          hustle: "Nur vorbereiten, wenn die aktuelle Box ganz leer und keine Vorratsbox vorhanden ist."
        },
        demand: ({ fill, reserve }) => Math.max((fill === 0 ? 1 : 0) - reserve, 0)
      },
      {
        id: "schinken",
        name: "Schinken",
        box: "Box mittel · 500-g-Pack",
        size: "medium",
        unit: "mittlere Box Schinken (1 × 500-g-Pack)",
        thresholds: { wenig: 50, normal: 75, hustle: 95 },

      {
        id: "biscoff-creme",
        name: "Biscoff-Creme",
        box: "Tube",
        size: "none",
        noReserve: true,
        unit: "Tube Biscoff-Creme vollständig auffüllen",
        rules: {
          wenig: "Bei 80 % oder weniger wird die Tube vollständig aufgefüllt.",
          normal: "Bei 80 % oder weniger wird die Tube vollständig aufgefüllt.",
          hustle: "Bei 80 % oder weniger wird die Tube vollständig aufgefüllt."
        },
        demand: ({ fill }) => fill <= 80 ? 1 : 0
      },
      {
        id: "weisse-schokolade",
        name: "Weiße Schokolade",
        box: "Box klein",
        size: "small",
        unit: "kleine Box weiße Schokolade auffüllen",
        stockCheck: "Liegt ein Nachfüllpack weiße Schokolade bereit?",
        rules: {
          wenig: "Bei leerer Box auffüllen und prüfen, ob ein Nachfüllpack bereitliegt.",
          normal: "Bei leerer Box auffüllen und prüfen, ob ein Nachfüllpack bereitliegt.",
          hustle: "Bei leerer Box auffüllen und prüfen, ob ein Nachfüllpack bereitliegt."
        },
        demand: ({ fill, reserve }) => Math.max((fill === 0 ? 1 : 0) - reserve, 0),
        extraActions: ({ stockReady }) => !stockReady
          ? [{ code: "pack", text: "1 Nachfüllpack weiße Schokolade bereitstellen" }]
          : []
      },
      {
        id: "haehnchenkebab",
        name: "Hähnchenkebab",
        box: "Box groß",
        size: "large",
        unit: "große Box Hähnchenkebab vorbereiten",
        rules: {
          wenig: "Eine neue große Box vorbereiten, außer die aktuelle Box ist noch zu mindestens 80 % gefüllt.",
          normal: "Unabhängig vom Füllstand eine neue große Box vorbereiten.",
          hustle: "Unabhängig vom Füllstand eine neue große Box vorbereiten."
        },
        demand: ({ fill, reserve, level }) => {
          const target = level === "wenig" && fill >= 80 ? 0 : 1;
          return Math.max(target - reserve, 0);
        }
      },
      {
        id: "mango",
        name: "Mango",
        box: "Box klein · TK",
        size: "small",
        unit: "kleine Box Mango auffüllen",
        stockCheck: "Liegt ein Nachfüllpack Mango im TK?",
        rules: {
          wenig: "Bei leerer Box auffüllen und prüfen, ob ein Nachfüllpack im TK liegt.",
          normal: "Bei leerer Box auffüllen und prüfen, ob ein Nachfüllpack im TK liegt.",
          hustle: "Bei leerer Box auffüllen und prüfen, ob ein Nachfüllpack im TK liegt."
        },
        demand: ({ fill, reserve }) => Math.max((fill === 0 ? 1 : 0) - reserve, 0),
        extraActions: ({ stockReady }) => !stockReady
          ? [{ code: "pack", text: "1 Nachfüllpack Mango in den TK legen" }]
          : []
      }
    ];

    const FILTERS = [
      { id: "all", label: "Alle" },
      { id: "meat", label: "Fleisch/Fisch" },
      { id: "cheese", label: "Käse" },
      { id: "vegetable", label: "Gemüse" },
      { id: "sweet", label: "Süß" }
    ];

    const CATEGORY_IDS = {
      meat: ["speck", "schinken", "sucuk", "thunfisch", "lachs", "maultaschen", "haehnchenkebab"],
      cheese: ["kaese", "muensterkaese", "mozzarella", "feta", "raclettekaese", "camembert", "ziegenkaese"],
      vegetable: ["maultaschen-vegetarisch", "zwiebeln", "rote-zwiebeln", "lauchzwiebeln", "champignons", "paprika", "zucchini", "tomaten", "spinat", "knoblauch", "chili", "peperoni", "oliven"],
      sweet: ["ananas", "datteln", "apfel", "banane", "beerenmischung", "himbeeren", "biscoff-creme", "weisse-schokolade", "mango"]
    };

    const CATEGORY_BY_ID = Object.fromEntries(
      Object.entries(CATEGORY_IDS).flatMap(([category, ids]) => ids.map(id => [id, category]))
    );

    const TOPPINGS = [
      "Sonnenblumenkerne", "Kürbiskerne", "Walnüsse", "Preiselbeeren", "Honig", "Pesto",
      "Dressing", "getrocknete Tomaten", "Avocado", "Schnittlauch", "Petersilie", "Basilikum",
      "Thymian", "Rucola", "Feldsalat", "Zimt & Zucker", "Nutella", "Lotus Kekse",
      "Schokoraspeln", "Oreo Kekse", "Vanillesoße", "Vanilleeis", "Schokoeis", "Kokosraspeln"
    ];

    const STORAGE_KEY = "clauss-kuechenvorbereitung-test-v1";
    const defaultState = () => ({
      level: "normal",
      checks: {},
      tasksDone: {},
      checkFilter: "all",
      todoFilter: "all"
    });
    let state = loadState();
    let activeId = null;
    let draft = { fill: 100, reserve: 0, ready: true };

    const grid = document.querySelector("#ingredientGrid");
    const checkFilters = document.querySelector("#checkFilters");
    const todoFilters = document.querySelector("#todoFilters");
    const todoFilterWrap = document.querySelector("#todoFilterWrap");
    const summary = document.querySelector("#summary");
    const progressBar = document.querySelector("#progressBar");
    const progressText = document.querySelector("#progressText");
    const modalBackdrop = document.querySelector("#modalBackdrop");
    const modalTitle = document.querySelector("#modalTitle");
    const modalBoxLabel = document.querySelector("#modalBoxLabel");
    const ruleNote = document.querySelector("#ruleNote");
    const sliderArea = document.querySelector("#sliderArea");
    const binaryArea = document.querySelector("#binaryArea");
    const stockCheck = document.querySelector("#stockCheck");
    const stockCheckLabel = document.querySelector("#stockCheckLabel");
    const fillLabel = document.querySelector("#fillLabel");
    const fillSlider = document.querySelector("#fillSlider");
    const fillOutput = document.querySelector("#fillOutput");
    const sliderScale = document.querySelector("#sliderScale");
    const reserveRow = document.querySelector("#reserveRow");
    const reserveValue = document.querySelector("#reserveValue");
    const liveResult = document.querySelector("#liveResult");

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (saved && ["wenig", "normal", "hustle"].includes(saved.level) && saved.checks) {
          saved.tasksDone = saved.tasksDone || {};
          saved.checkFilter = FILTERS.some(filter => filter.id === saved.checkFilter) ? saved.checkFilter : "all";
          saved.todoFilter = FILTERS.some(filter => filter.id === saved.todoFilter) ? saved.todoFilter : "all";
          return saved;
        }
      } catch (_) {}
      return defaultState();
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function ingredientById(id) {
      return INGREDIENTS.find(item => item.id === id);
    }

    function categoryFor(ingredientOrId) {
      const id = typeof ingredientOrId === "string" ? ingredientOrId : ingredientOrId.id;
      return CATEGORY_BY_ID[id];
    }

    function matchesFilter(category, filter) {
      return filter === "all" || category === filter;
    }

    function renderFilterButtons(container, activeFilter, onSelect) {
      container.innerHTML = "";
      FILTERS.forEach(filter => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `filter-button${filter.id === activeFilter ? " active" : ""}`;
        button.textContent = filter.label;
        button.setAttribute("aria-pressed", String(filter.id === activeFilter));
        button.addEventListener("click", () => onSelect(filter.id));
        container.appendChild(button);
      });
    }

    function neededFor(ingredient, values) {
      return ingredient.demand({ ...values, level: state.level, ingredient });
    }

    function quantityText(quantity, ingredient) {
      if (!quantity) return "Nichts vorzubereiten";
      if (ingredient.binary) return ingredient.unit;
      const rounded = Math.round((quantity + Number.EPSILON) * 100) / 100;
      const formatted = rounded.toLocaleString("de-DE", { maximumFractionDigits: 2 });
      return `${formatted} ${rounded > 1 && ingredient.pluralUnit ? ingredient.pluralUnit : ingredient.unit}`;
    }

    function preparationsFor(ingredient, values) {
      const actions = [];
      const quantity = neededFor(ingredient, values);
      if (quantity > 0) actions.push({
        key: `${ingredient.id}:box`,
        text: quantityText(quantity, ingredient),
        category: categoryFor(ingredient)
      });
      if (ingredient.extraActions) {
        ingredient.extraActions(values).forEach(action => actions.push({
          key: `${ingredient.id}:${action.code}`,
          text: action.text,
          category: categoryFor(ingredient)
        }));
      }
      return actions;
    }

    function checkedDescription(ingredient, check) {
      if (ingredient.checkedText) return ingredient.checkedText(check);
      if (ingredient.binary) return check.ready ? "Packung liegt bereit" : "Keine Packung bereit";
      if (ingredient.coverage) {
        const reserveText = check.reserve === 1 ? "1 Vorratsbox" : `${check.reserve} Vorratsboxen`;
        return `Bestand reicht für ${check.coverage} Flammkuchen · ${reserveText}`;
      }
      const reserveText = ingredient.noReserve
        ? ""
        : ` · ${check.reserve === 1 ? "1 Vorratsbox" : `${check.reserve} Vorratsboxen`}`;
      const stockText = ingredient.stockCheck
        ? ` · Vorratspackung ${check.stockReady ? "vorhanden" : "fehlt"}`
        : "";
      return `${check.fill} %${reserveText}${stockText}`;
    }

    function render() {
      document.querySelectorAll("[data-level]").forEach(button => {
        const active = button.dataset.level === state.level;
        button.classList.toggle("active", active);
        button.setAttribute("aria-pressed", String(active));
      });

      const completed = Object.keys(state.checks).filter(id => ingredientById(id)).length;
      progressText.textContent = `${completed} von ${INGREDIENTS.length} geprüft`;
      progressBar.style.width = `${completed / INGREDIENTS.length * 100}%`;

      renderFilterButtons(checkFilters, state.checkFilter, filter => {
        state.checkFilter = filter;
        saveState();
        render();
      });

      const remaining = INGREDIENTS.filter(item => !state.checks[item.id]);
      const visibleIngredients = remaining.filter(item => matchesFilter(categoryFor(item), state.checkFilter));
      grid.innerHTML = "";
      visibleIngredients.forEach(ingredient => {
        const card = document.createElement("button");
        card.type = "button";
        card.className = `ingredient-card size-${ingredient.size} category-${categoryFor(ingredient)}`;
        card.dataset.ingredient = ingredient.id;
        card.innerHTML = `
          <span class="box-tag">${ingredient.box}</span>
          <span class="ingredient-name">${ingredient.name}</span>
          <span class="card-action">Jetzt prüfen →</span>
        `;
        card.addEventListener("click", () => openIngredient(ingredient.id));
        grid.appendChild(card);
      });

      if (!visibleIngredients.length && remaining.length) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.textContent = "In dieser Kategorie sind keine Zutaten mehr offen.";
        grid.appendChild(empty);
      }

      const complete = completed === INGREDIENTS.length;
      summary.classList.toggle("visible", complete);
      if (complete) renderSummary();
    }

    function renderSummary() {
      const preparations = INGREDIENTS.flatMap(ingredient =>
        preparationsFor(ingredient, state.checks[ingredient.id])
      );
      const doneCount = preparations.filter(item => state.tasksDone[item.key]).length;
      const visiblePreparations = preparations.filter(item => matchesFilter(item.category, state.todoFilter));

      todoFilterWrap.hidden = preparations.length === 0;
      renderFilterButtons(todoFilters, state.todoFilter, filter => {
        state.todoFilter = filter;
        saveState();
        renderSummary();
      });

      document.querySelector("#summaryIntro").textContent = preparations.length
        ? `${levelSummary(state.level)} ist Folgendes vorzubereiten (${doneCount} von ${preparations.length} erledigt):`
        : "Die vorhandenen Bestände reichen für den erwarteten Abend aus.";

      const prepList = document.querySelector("#prepList");
      prepList.innerHTML = "";
      if (!preparations.length) {
        prepList.innerHTML = '<li class="all-good">✓ Aktuell muss nichts zusätzlich vorbereitet werden.</li>';
      } else if (!visiblePreparations.length) {
        prepList.innerHTML = '<li class="all-good">In dieser Kategorie gibt es aktuell keine Aufgaben.</li>';
      } else {
        visiblePreparations.forEach((preparation, index) => {
          const li = document.createElement("li");
          const done = Boolean(state.tasksDone[preparation.key]);
          li.className = `prep-item category-${preparation.category}${done ? " done" : ""}`;
          li.innerHTML = `
            <label class="prep-check">
              <input type="checkbox" data-task="${preparation.key}" ${done ? "checked" : ""}>
              <span class="prep-number">${done ? "✓" : index + 1}</span>
              <strong class="prep-text">${preparation.text}</strong>
            </label>
          `;
          li.querySelector("input").addEventListener("change", event => {
            state.tasksDone[preparation.key] = event.target.checked;
            saveState();
            renderSummary();
          });
          prepList.appendChild(li);
        });
      }

      const toppingsList = document.querySelector("#toppingsList");
      toppingsList.innerHTML = "";
      TOPPINGS.forEach(topping => {
        const key = `topping:${topping}`;
        const done = Boolean(state.tasksDone[key]);
        const li = document.createElement("li");
        li.className = `prep-item category-toppings${done ? " done" : ""}`;
        li.innerHTML = `
          <label class="prep-check">
            <input type="checkbox" data-task="${key}" ${done ? "checked" : ""}>
            <strong class="prep-text">${topping}</strong>
          </label>
        `;
        li.querySelector("input").addEventListener("change", event => {
          state.tasksDone[key] = event.target.checked;
          saveState();
          renderSummary();
        });
        toppingsList.appendChild(li);
      });

      const checkedList = document.querySelector("#checkedList");
      checkedList.innerHTML = "";
      INGREDIENTS.forEach(ingredient => {
        const li = document.createElement("li");
        li.className = "checked-item";
        li.innerHTML = `
          <span><strong>${ingredient.name}</strong><br><span class="checked-meta">${checkedDescription(ingredient, state.checks[ingredient.id])}</span></span>
          <button class="edit-button" type="button" data-edit="${ingredient.id}">Ändern</button>
        `;
        li.querySelector("button").addEventListener("click", () => openIngredient(ingredient.id));
        checkedList.appendChild(li);
      });
    }

    function levelName(level) {
      return ({ wenig: "Wenig", normal: "Normal", hustle: "Hustle" })[level];
    }

    function levelSummary(level) {
      return ({
        wenig: "Für einen ruhigen Abend",
        normal: "Für einen normalen Abend",
        hustle: "Für einen Hustle-Abend"
      })[level];
    }

    function openIngredient(id) {
      const ingredient = ingredientById(id);
      const saved = state.checks[id];
      activeId = id;
      draft = ingredient.binary
        ? { ready: saved ? saved.ready : true }
        : ingredient.coverage
          ? {
              coverage: saved ? saved.coverage : ingredient.targets[state.level],
              reserve: saved ? (saved.reserve ?? 0) : 0
            }
        : {
            fill: saved ? saved.fill : 100,
            reserve: saved ? saved.reserve : 0,
            stockReady: ingredient.stockCheck ? (saved ? saved.stockReady !== false : true) : undefined
          };

      modalTitle.textContent = ingredient.name;
      modalBoxLabel.textContent = ingredient.box;
      ruleNote.textContent = `${levelName(state.level)}: ${ingredient.rules[state.level]}`;
      sliderArea.hidden = Boolean(ingredient.binary);
      binaryArea.hidden = !ingredient.binary;
      document.querySelector("#binaryArea .field-label").textContent = ingredient.readyQuestion || "Liegt eine Packung bereit?";
      document.querySelector("#readyYes").textContent = ingredient.binaryLabels?.yes || "Ja, bereit";
      document.querySelector("#readyNo").textContent = ingredient.binaryLabels?.no || "Nein";
      stockCheck.hidden = !ingredient.stockCheck;
      stockCheckLabel.textContent = ingredient.stockCheck || "";
      const isCoverage = Boolean(ingredient.coverage);
      fillLabel.textContent = isCoverage ? "Wie viele Flammkuchen kannst du noch belegen?" : "Aktuelle Box gefüllt";
      fillSlider.min = "0";
      fillSlider.max = isCoverage ? String(Math.max(ingredient.targets[state.level] + 4, 10)) : "100";
      fillSlider.step = isCoverage ? "1" : "5";
      fillSlider.value = isCoverage ? draft.coverage : (draft.fill ?? 100);
      sliderScale.innerHTML = isCoverage
        ? `<span>0</span><span>Soll: ${ingredient.targets[state.level]}</span><span>${fillSlider.max}</span>`
        : "<span>leer</span><span>halbvoll</span><span>voll</span>";
      reserveRow.hidden = Boolean(ingredient.noReserve);
      reserveValue.textContent = draft.reserve ?? 0;
      updateModal();
      modalBackdrop.classList.add("open");
      document.body.style.overflow = "hidden";
      document.querySelector("#closeModal").focus();
    }

    function closeModal() {
      modalBackdrop.classList.remove("open");
      document.body.style.overflow = "";
      activeId = null;
    }

    function updateModal() {
      const ingredient = ingredientById(activeId);
      if (!ingredient) return;
      fillOutput.textContent = ingredient.coverage
        ? `${draft.coverage ?? 0} Flammkuchen`
        : `${draft.fill ?? 100} %`;
      reserveValue.textContent = draft.reserve ?? 0;
      document.querySelectorAll("[data-ready]").forEach(button => {
        button.classList.toggle("selected", String(draft.ready) === button.dataset.ready);
      });
      document.querySelectorAll("[data-stock-ready]").forEach(button => {
        button.classList.toggle("selected", String(draft.stockReady) === button.dataset.stockReady);
      });
      const preparations = preparationsFor(ingredient, draft);
      liveResult.classList.toggle("needs-prep", preparations.length > 0);
      liveResult.innerHTML = preparations.length > 0
        ? `<strong>Vorbereiten:</strong>${preparations.map(item => item.text).join("<br>")}`
        : "<strong>Bestand reicht aus.</strong>Für diese Zutat ist nichts zusätzlich vorzubereiten.";
    }

    document.querySelectorAll("[data-level]").forEach(button => {
      button.addEventListener("click", () => {
        state.level = button.dataset.level;
        state.tasksDone = {};
        saveState();
        render();
      });
    });

    fillSlider.addEventListener("input", () => {
      const ingredient = ingredientById(activeId);
      if (ingredient.coverage) draft.coverage = Number(fillSlider.value);
      else draft.fill = Number(fillSlider.value);
      updateModal();
    });

    document.querySelector("#reserveMinus").addEventListener("click", () => {
      draft.reserve = Math.max(0, (draft.reserve ?? 0) - 1);
      updateModal();
    });

    document.querySelector("#reservePlus").addEventListener("click", () => {
      draft.reserve = Math.min(9, (draft.reserve ?? 0) + 1);
      updateModal();
    });

    document.querySelectorAll("[data-ready]").forEach(button => {
      button.addEventListener("click", () => {
        draft.ready = button.dataset.ready === "true";
        updateModal();
      });
    });

    document.querySelectorAll("[data-stock-ready]").forEach(button => {
      button.addEventListener("click", () => {
        draft.stockReady = button.dataset.stockReady === "true";
        updateModal();
      });
    });

    document.querySelector("#confirmButton").addEventListener("click", () => {
      Object.keys(state.tasksDone).forEach(key => {
        if (key.startsWith(`${activeId}:`)) delete state.tasksDone[key];
      });
      state.checks[activeId] = { ...draft };
      saveState();
      closeModal();
      render();
    });

    document.querySelector("#closeModal").addEventListener("click", closeModal);
    modalBackdrop.addEventListener("click", event => {
      if (event.target === modalBackdrop) closeModal();
    });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && modalBackdrop.classList.contains("open")) closeModal();
    });

    document.querySelector("#resetButton").addEventListener("click", () => {
      if (!confirm("Alle Eingaben löschen und neu beginnen?")) return;
      state = defaultState();
      saveState();
      render();
    });

    render();
  </script>
</body>
</html>
