<style>
/* Farben und Schriften wie auf clauss-flammkuchen.de und der Iglu-Seite */
:root {
  color-scheme: light;
  --papier: #efe9df;
  --tinte: #111111;
  --grau: #655f58;
  --rosa: #d8b3c1;
  --linie: rgba(17, 17, 17, .28);
  --serif: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, "Times New Roman", serif;
  --sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--papier); color: var(--tinte); font: 17px/1.5 var(--sans); }
a { color: inherit; text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--tinte); outline-offset: 2px; }

.kopf { max-width: 980px; margin: 0 auto; padding: 22px 16px 16px; text-align: center; border-bottom: 1px solid var(--linie); }
.logo { display: inline-block; text-decoration: none; font: 30px/1.1 var(--serif); }
.logo img { display: block; width: 230px; max-width: 62vw; height: auto; }

.auswahl { max-width: 980px; margin: 0 auto; padding: 40px 16px 48px; display: grid; grid-template-columns: 1fr 1fr; gap: 56px; }
.feld { display: flex; flex-direction: column; align-items: center; text-align: center; text-decoration: none; }
.skizze { display: block; width: 100%; max-width: 380px; margin-bottom: 20px; overflow: visible; fill: none; stroke: var(--tinte); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.skizze .facette { stroke-width: 1.3; }
.skizze .rand { stroke-width: 2; }
.skizze .voll { fill: var(--papier); }
.skizze .fein { stroke-width: 1; }
.feld h2 { font: 400 26px/1.25 var(--serif); margin: 0; }
.mindest { font: 19px/1.4 var(--serif); margin: 6px 0 20px; }
.knopf { margin-top: auto; padding: 10px 26px; border: 1px solid var(--tinte); }
.feld:hover .knopf { background: var(--rosa); }

.fuss { max-width: 980px; margin: 0 auto; padding: 18px 16px 28px; border-top: 1px solid var(--linie); color: var(--grau); font-size: 15px; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 20px; }

@media (max-width: 680px) {
  .auswahl { grid-template-columns: 1fr; gap: 44px; padding-top: 28px; }
  .feld h2 { margin-bottom: 20px; }
  .feld h2:has(+ .mindest) { margin-bottom: 0; }
}
</style>
</head>
