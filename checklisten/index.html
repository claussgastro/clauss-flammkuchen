  <style>
    :root { --ink:#171513; --muted:#6f6964; --paper:#f6f1eb; --card:#fffdf9; --rose:#c97d82; --rose-dark:#8f4c53; --line:#e6d9d2; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px 16px; color:var(--ink);
      background:radial-gradient(ellipse at 0 0, #f0dfe0 0, transparent 42rem), var(--paper);
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; line-height:1.45; }
    .lock { width:min(100%, 420px); }
    .eyebrow { margin:0 0 8px; color:var(--rose-dark); font-size:.68rem; font-weight:800; letter-spacing:.12em; text-transform:uppercase; }
    h1 { margin:0 0 22px; font-size:clamp(1.75rem,6vw,2.4rem); font-weight:750; letter-spacing:-.035em; line-height:1.12; }
    form { padding:24px; border:1px solid var(--line); border-radius:24px; background:var(--card); box-shadow:0 6px 22px rgba(48,39,32,.05); }
    label { display:block; margin-bottom:8px; font-weight:700; font-size:.9rem; }
    input { width:100%; min-height:52px; padding:12px 14px; border:1px solid var(--line); border-radius:14px; background:white; color:var(--ink); font:inherit; font-size:1.1rem; }
    input:focus { outline:3px solid rgba(201,125,130,.45); outline-offset:2px; border-color:var(--rose); }
    button { width:100%; min-height:52px; margin-top:14px; border:0; border-radius:999px; background:var(--ink); color:white; font:inherit; font-weight:750; font-size:1rem; cursor:pointer; }
    button:disabled { opacity:.6; cursor:wait; }
    .hint { margin:14px 0 0; color:var(--muted); font-size:.82rem; }
    .error { margin:12px 0 0; padding:10px 12px; border-radius:12px; background:#f5dfdb; color:#7a292b; font-size:.9rem; }
    [hidden] { display:none !important; }
  </style>

    const STORE = "clauss-checklisten-zugang";
    const DAYS = 90;
    const $ = id => document.getElementById(id);
    const fromB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
    const toB64 = b => btoa(String.fromCharCode(...new Uint8Array(b)));

    function showLock(message) {
      $("lock").hidden = false;
      $("go").disabled = false;
      $("go").textContent = "Öffnen";
      if (message) { $("error").textContent = message; $("error").hidden = false; }
      $("pw").focus();
    }

    async function decrypt(rawKey) {
      const key = await crypto.subtle.importKey("raw", rawKey, "AES-GCM", false, ["decrypt"]);
      const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: fromB64(DATA.iv) }, key, fromB64(DATA.data));
      return new TextDecoder().decode(plain);
    }

    function openPage(html) {
      document.open();
      document.write(html);
      document.close();
    }

    async function keyFromPassword(password) {
      const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits"]);
      return crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: fromB64(DATA.salt), iterations: DATA.it }, base, 256);
    }

    async function start() {
      if (!window.crypto || !crypto.subtle) { showLock("Dieser Browser unterstützt die Verschlüsselung nicht. Bitte Chrome verwenden."); return; }
      let saved = null;
      try { saved = JSON.parse(localStorage.getItem(STORE)); } catch (_) {}
      if (saved && saved.key && saved.until > Date.now()) {
        try { openPage(await decrypt(fromB64(saved.key))); return; }
        catch (_) { try { localStorage.removeItem(STORE); } catch (_) {} }   // Passwort wurde geändert
      } else if (saved) {
        try { localStorage.removeItem(STORE); } catch (_) {}
      }
      showLock(saved && saved.until <= Date.now() ? "Die 90 Tage sind abgelaufen. Bitte das Passwort erneut eingeben." : "");
    }

    $("form").addEventListener("submit", async event => {
      event.preventDefault();
      $("error").hidden = true;
      $("go").disabled = true;
      $("go").textContent = "Wird geöffnet …";
      try {
        const raw = await keyFromPassword($("pw").value);
        const html = await decrypt(raw);
        try { localStorage.setItem(STORE, JSON.stringify({ key: toB64(raw), until: Date.now() + DAYS * 86400000 })); } catch (_) {}
        openPage(html);
      } catch (_) {
        $("pw").value = "";
        showLock("Falsches Passwort.");
      }
    });

    start();
  })();
  </script>
